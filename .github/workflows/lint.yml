name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  composer-normalize-slim:
    runs-on: ubuntu-slim
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: "composer-normalize:2"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: composer.json
          sparse-checkout-cone-mode: false

      - run: composer-normalize --dry-run

  composer-normalize-26:
    runs-on: ubuntu-26.04
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: "composer-normalize:2"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: composer.json
          sparse-checkout-cone-mode: false

      - run: composer-normalize --dry-run

  composer-normalize-slim-parallel:
    runs-on: ubuntu-slim
    steps:
      - parallel:
        - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
          with:
            php-version: '8.5'
            coverage: none
            tools: "composer-normalize:2"

        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            sparse-checkout: composer.json
            sparse-checkout-cone-mode: false

      - run: composer-normalize --dry-run

  composer-normalize-26-parallel:
    runs-on: ubuntu-26.04
    steps:
      - parallel:
        - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
          with:
            php-version: '8.5'
            coverage: none
            tools: "composer-normalize:2"

        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            sparse-checkout: composer.json
            sparse-checkout-cone-mode: false

      - run: composer-normalize --dry-run

  actions:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/lint-actions.yml@68b2ff84a9d7b58ee3943e697f76cd9a3a51f8cc

  php:
    permissions:
      contents: read
    uses: typisttech/.github/.github/workflows/lint-php.yml@68b2ff84a9d7b58ee3943e697f76cd9a3a51f8cc
    with:
      phpstan: true
      mago: true
      box: true
      box-php-version: '8.5'
      box-version: '4'

  go:
    permissions:
      contents: read
    uses: typisttech/.github/.github/workflows/lint-go.yml@68b2ff84a9d7b58ee3943e697f76cd9a3a51f8cc
    with:
      golangci-lint: true
      golangci-lint-version-file: .tool-versions

  wait-for-all-lint:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    needs:
      - actions
      - php
      - go
    runs-on: ubuntu-latest
    steps:
      - name: Assert no required jobs were cancelled or failed
        run: exit 1

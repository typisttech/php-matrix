name: Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  PHP_VERSION: '8.5'
  BOX_VERSION: '4'
  SPC_VERSION: '2.8.5'

jobs:
  unit:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    outputs:
      coverage-artifact-id: ${{ steps.upload-coverage.outputs.artifact-id }}
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: ${{ env.PHP_VERSION }}
            coverage: xdebug

      - uses: typisttech/.github/.github/actions/composer-install@e8fb21eeafb5416e1d47d71d5ac656b61e524af1 # v9.3.0
        with:
          prefer: locked

      - run: composer pest -- --group=unit --coverage-clover coverage-unit.xml --ci

      - id: upload-coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: coverage-unit.xml
          archive: false
          if-no-files-found: error

  codecov:
    needs:
      - unit
    permissions:
      id-token: write
      contents: read
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            artifact-ids: ${{ needs.unit.outputs.coverage-artifact-id }}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage-unit.xml
          flags: unit

  phar:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    outputs:
      phar-artifact-id: ${{ steps.upload-phar.outputs.artifact-id }}
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            fetch-depth: 0

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: ${{ env.PHP_VERSION }}
            coverage: none
            tools: "box:${{ env.BOX_VERSION }}"

      - uses: typisttech/.github/.github/actions/composer-install@e8fb21eeafb5416e1d47d71d5ac656b61e524af1 # v9.3.0
        with:
          prefer: locked
          composer-options: --no-dev --prefer-dist --optimize-autoloader

      - run: box compile

      - id: upload-phar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: phar/php-matrix
          archive: false
          if-no-files-found: error

  build:
    name: Build (${{ matrix.runs-on }})
    needs:
      - phar
    permissions:
      contents: read
    strategy:
      matrix: &matrix
        include:
          - runs-on: ubuntu-26.04-arm
            variant: linux_arm64
            spc-variant: linux-aarch64
          - runs-on: ubuntu-26.04
            variant: linux_amd64
            spc-variant: linux-x86_64
          - runs-on: xcode-27
            variant: darwin_arm64
            spc-variant: macos-aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
            sparse-checkout: craft.yml
            sparse-checkout-cone-mode: false

        - name: Install spc
          run: |
            gh release download --repo crazywhalecc/static-php-cli "${SPC_VERSION}" --pattern "${PATTERN}" --output spc.tar.gz && \
            mkdir spc && \
            tar -xvf spc.tar.gz --directory spc && \
            mkdir bin && \
            cp spc/spc bin/spc && \
            echo "$(pwd)/bin" >> "$GITHUB_PATH"
          env:
            SPC_VERSION: ${{ env.SPC_VERSION }}
            PATTERN: spc-${{ matrix.spc-variant }}.tar.gz
            GH_TOKEN: ${{ github.token }}
          working-directory: ${{ runner.temp }}

        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            artifact-ids: ${{ needs.phar.outputs.phar-artifact-id }}
            path: phar

      - name: Cache micro.sfx
        id: cache-micro-sfx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buildroot/bin/micro.sfx
          key: micro-sfx-${{ runner.os }}-${{ runner.arch }}-${{ env.SPC_VERSION }}-${{ env.PHP_VERSION }}-${{ hashFiles('craft.yml') }}

      - name: Build micro.sfx
        if: steps.cache-micro-sfx.outputs.cache-hit != 'true'
        run: spc craft
        env:
          GITHUB_TOKEN: ${{ github.token }} # Not a typo.

      - run: mkdir -p out
      - run: spc micro:combine phar/php-matrix --output out/php-matrix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-matrix_${{ matrix.variant }}
          path: out/php-matrix
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.runs-on }})
    needs:
      - build
    permissions:
      contents: read
    strategy:
      matrix: *matrix
    runs-on: ${{ matrix.runs-on }}
    env:
      GOFLAGS: '-mod=mod'
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            name: php-matrix_${{ matrix.variant }}
            path: ${{ runner.temp }}/php-matrix/bin

      - parallel:
        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
          with:
            go-version-file: 'go.mod'

        - name: Grant the binary execute permission
          run: chmod +x "${BIN_DIR}/php-matrix"
          env:
            BIN_DIR: ${{ runner.temp }}/php-matrix/bin

        - name: Add the binary into PATH
          run: echo "${BIN_DIR}" >> "$GITHUB_PATH"
          env:
            BIN_DIR: ${{ runner.temp }}/php-matrix/bin

      - name: Print the binary path
        run: go test -count=1 -v ./internal

      - run: go test -count=1 -shuffle=on ./...

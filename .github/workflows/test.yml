name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    outputs:
      coverage-artifact-id: ${{ steps.upload-coverage.outputs.artifact-id }}
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: '8.5'
            coverage: xdebug

      - uses: typisttech/.github/.github/actions/composer-install@51e7a334c027d04864092d8b5469d1ccc5dcfcb6 # v9.0.1
        with:
          prefer: locked

      - run: composer pest -- --group=unit --coverage-clover coverage-unit.xml --ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-coverage
        with:
          path: coverage-unit.xml
          archive: false
          if-no-files-found: error

  codecov:
    needs:
      - unit
    permissions:
      contents: read
      id-token: write
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            artifact-ids: ${{ needs.unit.outputs.coverage-artifact-id }}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage-unit.xml
          flags: unit

  build:
    permissions:
      contents: read
    uses: $/.github/workflows/build.yml

  e2e:
    name: e2e (${{ matrix.runs-on }})
    needs:
      - build
    permissions:
      contents: read
    strategy:
      matrix: # Must be kept in sync with build.yml
        include:
          - runs-on: ubuntu-26.04-arm
            variant: linux_arm64
            spc-variant: linux-aarch64
          - runs-on: ubuntu-26.04
            variant: linux_amd64
            spc-variant: linux-x86_64
          - runs-on: macos-26
            variant: darwin_arm64
            spc-variant: macos-aarch64
          - runs-on: macos-26-intel
            variant: darwin_amd64
            spc-variant: macos-x86_64
    runs-on: ${{ matrix.runs-on }}
    env:
      GOFLAGS: '-mod=mod'
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          id: download-artifact
          with:
            name: php-matrix_${{ matrix.variant }}
            path: ${{ runner.temp }}/php-matrix/bin

      - parallel:
        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
          with:
            go-version-file: 'go.mod'

        - name: Grant the binary execute permission
          run: chmod +x "${BIN_DIR}/php-matrix"
          env:
            BIN_DIR: ${{ runner.temp }}/php-matrix/bin

        - name: Add the binary into PATH
          run: echo "${BIN_DIR}" >> "$GITHUB_PATH"
          env:
            BIN_DIR: ${{ runner.temp }}/php-matrix/bin

      - name: Print the binary path
        run: go test -count=1 -v ./internal

      - run: go test -count=1 -shuffle=on ./...

  tmp-debuggggggg:
    needs:
      - build
    permissions:
      contents: read
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php-matrix_-*
          merge-multiple: true

      - run: ls -laR .

name: Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: '13 3 * * *'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - run: ./bin/generate-data
      - run: ./bin/generate-test-data

      - uses: typisttech/create-auto-merged-pull-request-action@f0a86ebee40d6cbeeb68e29ec01240fe955b5a17 # v0.2.5
        with:
          client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
          private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
          branch: "tastendruck/github_actions/update-data/${{ github.ref_name }}"
          title: ":robot: `./bin/generate-data && ./bin/generate-test-data`"
          labels: update-data
          add-paths: |
            /tests/data/versions/*
            /data/*

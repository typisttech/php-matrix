name: Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: '13 3 * * *'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  update-data:
    permissions:
      contents: read
    cache-mode: none
    runs-on: ubuntu-26.04
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
            php-version: '8.5'
            coverage: none

      - uses: typisttech/.github/.github/actions/composer-install@35e5494fea692807fa0060dce74b5ed55cf5fd3a # v9.1.1
        with:
          prefer: locked

      - parallel:
        - run: ./bin/generate-data
        - run: ./bin/generate-test-data

      - uses: typisttech/.github/.github/actions/create-auto-merged-pull-request@35e5494fea692807fa0060dce74b5ed55cf5fd3a # v9.1.1
        with:
          client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
          private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
          branch: "tastendruck/github_actions/update-data/${{ github.ref_name }}"
          title: ":robot: `./bin/generate-data && ./bin/generate-test-data`"
          labels: update-data
          add-paths: |
            /tests/data/versions/*
            /data/*

name: Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  release-drafter:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read
    cache-mode: none
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
          private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: php-matrix
          permission-contents: write
          permission-pull-requests: read

      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          tag: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

  test:
    permissions:
      id-token: write
      contents: read
    cache-mode: none
    uses: $/.github/workflows/test.yml

  goreleaser:
    needs:
      - test
      - release-drafter
    permissions:
      # For GoReleaser
      contents: write
      # For actions/attest
      id-token: write
      attestations: write
      artifact-metadata: write
    cache-mode: none
    runs-on: ubuntu-26.04
    outputs:
      dist-artifact-id: ${{ steps.upload-dist.outputs.artifact-id }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
        background: true

      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
          private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
        background: true

      # For goreleaser-action to verify the integrity of its downloaded GoReleaser archive
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        background: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php-matrix_*_*
          path: out
        background: true

      - wait: checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - wait-all:

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_HOMEBREW_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
        background: true

      - id: upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: |
            dist/*.apk
            dist/*.deb
          if-no-files-found: error
        background: true

  cloudsmith:
    needs:
      - goreleaser
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - parallel:
        - uses: cloudsmith-io/cloudsmith-cli-action@92b1383b22bbd36d804b858f273abcdf4d349f6b # v3.2.1
          with:
            api-key: ${{ secrets.CLOUDSMITH_API_KEY_TASTENDRUCK }}

        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            artifact-ids: ${{ needs.goreleaser.outputs.dist-artifact-id }}

        - id: strip-leading-v
          run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          env:
            TAG: ${{ github.ref_name }}

      - parallel:
        - run: cloudsmith push deb typisttech/oss/any-distro/any-version "php-matrix_${VERSION}_linux_amd64.deb"
          env:
            VERSION: ${{ steps.strip-leading-v.outputs.version }}
        - run: cloudsmith push deb typisttech/oss/any-distro/any-version "php-matrix_${VERSION}_linux_arm64.deb"
          env:
            VERSION: ${{ steps.strip-leading-v.outputs.version }}
        - run: cloudsmith push alpine typisttech/oss/alpine/any-version "php-matrix_${VERSION}_linux_amd64.apk"
          env:
            VERSION: ${{ steps.strip-leading-v.outputs.version }}
        - run: cloudsmith push alpine typisttech/oss/alpine/any-version "php-matrix_${VERSION}_linux_arm64.apk"
          env:
            VERSION: ${{ steps.strip-leading-v.outputs.version }}

name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '26 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  php:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: typisttech/.github/.github/workflows/audit-php.yml@51e7a334c027d04864092d8b5469d1ccc5dcfcb6 # v9.0.1

  go:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: typisttech/.github/.github/workflows/audit-go.yml@51e7a334c027d04864092d8b5469d1ccc5dcfcb6 # v9.0.1

  wait-for-all-audit:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    needs:
      - php
      - go
    runs-on: ubuntu-slim
    steps:
      - name: Assert no required jobs were cancelled or failed
        run: exit 1

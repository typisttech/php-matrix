name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '26 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  php:
    uses: typisttech/.github/.github/workflows/audit-php.yml@d16ec3549bdab47d10e9863e52ac148e5edd348e

  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@d16ec3549bdab47d10e9863e52ac148e5edd348e

name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '26 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  php:
    uses: typisttech/.github/.github/workflows/audit-php.yml@f421090f96b7e7a728b6286546e314d383b46e6e

  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@f421090f96b7e7a728b6286546e314d383b46e6e

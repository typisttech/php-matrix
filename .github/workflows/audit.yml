name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '26 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  php:
    uses: typisttech/.github/.github/workflows/audit-php.yml@3f674a5909b5d638f6f2e8a00aaf5bba67f81a48

  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@3f674a5909b5d638f6f2e8a00aaf5bba67f81a48

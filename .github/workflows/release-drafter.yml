name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/release-drafter.yml@d4c46e1552c88b1e50307c79456ae6570fbc562e # v9.3.5

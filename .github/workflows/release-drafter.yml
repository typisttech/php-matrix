name: Test DEBUG

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-omnit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: github-script ACTIONS_CACHE_MODE
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            console.log(`ACTIONS_CACHE_MODE=${process.env.ACTIONS_CACHE_MODE ?? '(unssssssset)'}`)

      - name: foo ACTIONS_CACHE_MODE
        uses: ./.github/actions/foo

      - name: Inspect cache mode
        run: |
          echo "ACTIONS_CACHE_MODE=${ACTIONS_CACHE_MODE-uuuuuuuuuuunset}"

  test-none:
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: github-script ACTIONS_CACHE_MODE
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            console.log(`ACTIONS_CACHE_MODE=${process.env.ACTIONS_CACHE_MODE ?? '(unssssssset)'}`)

      - name: foo ACTIONS_CACHE_MODE
        uses: ./.github/actions/foo

      - name: Inspect cache mode
        run: |
          echo "ACTIONS_CACHE_MODE=${ACTIONS_CACHE_MODE-uuuuuuuuuuunset}"

  test-wo:
    cache-mode: write-only
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: github-script ACTIONS_CACHE_MODE
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            console.log(`ACTIONS_CACHE_MODE=${process.env.ACTIONS_CACHE_MODE ?? '(unssssssset)'}`)

      - name: foo ACTIONS_CACHE_MODE
        uses: ./.github/actions/foo

      - name: Inspect cache mode
        run: |
          echo "ACTIONS_CACHE_MODE=${ACTIONS_CACHE_MODE-uuuuuuuuuuunset}"
